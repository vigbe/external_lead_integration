<!doctype html>
<html lang="es">
  <!--
  External Lead Integration — reference contact form.

  This is a SELF-CONTAINED example you embed in your EXTERNAL marketing
  website / landing page. It POSTs JSON to the module endpoint of your Odoo
  database with the `X-API-Key` header.

  =====================================================================
  HOW TO CONNECT
  =====================================================================
  1. Odoo's public URL is stored in System Parameters under `web.base.url`
     (Settings ‣ Technical ‣ Parameters ‣ System Parameters),
     e.g. https://crm.ia-prop.com . That is ALWAYS the host the integrator
     connects to.
  2. The endpoint is that base URL + `/api/v1/leads`:
         https://<web.base.url>/api/v1/leads
     Set it in ENDPOINT_URL below.
  3. The website and Odoo are DIFFERENT domains, so the browser blocks the
     cross-origin request unless Odoo returns CORS headers. CORS MUST be
     enabled — either in the module (`controllers/main.py`) or at the
     nginx/reverse-proxy edge. Without it this fetch never reaches Odoo.
  4. Create an API key in Odoo (CRM ‣ Configuration ‣ External Lead API Keys)
     and put it in API_KEY below.

  =====================================================================
  SECURITY WARNING — read before putting this on a public site.
  =====================================================================
  The API key lives in client-side JavaScript, so ANY visitor can read it
  from the browser DevTools (Network tab / Sources) and reuse it to inject
  spam leads. This is acceptable for a quick demo ONLY. For production you
  MUST, at minimum:
    1. Put Odoo behind a reverse proxy (nginx) with TLS.
    2. Add aggressive rate limiting + abuse protection (reCAPTCHA / WAF).
    3. Ideally proxy the request through your own backend that holds the
       key, so the secret never reaches the browser.
-->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario de contacto</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --border: #d8dbe2;
        --text: #1f2330;
        --muted: #6b7280;
        --brand: #714b67;
        --brand-dark: #5a3a52;
        --ok: #1f9d55;
        --warn: #b7791f;
        --err: #dc2626;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .elf-wrap {
        max-width: 560px;
        margin: 32px auto;
        padding: 28px 24px 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow:
          0 1px 3px rgba(16, 24, 40, 0.06),
          0 1px 2px rgba(16, 24, 40, 0.04);
      }
      .elf-wrap h2 {
        margin: 0 0 4px;
        font-size: 1.25rem;
      }
      .elf-wrap p.elf-sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 8px;
      }
      legend {
        font-weight: 600;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 8px;
      }
      .elf-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
      }
      .elf-field {
        display: flex;
        flex-direction: column;
      }
      .elf-field.full {
        grid-column: 1 / -1;
      }
      label {
        font-size: 0.85rem;
        margin-bottom: 4px;
        font-weight: 500;
      }
      label .req {
        color: var(--err);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        color: var(--text);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(113, 75, 103, 0.15);
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      .elf-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-top: 18px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.05s;
      }
      .elf-btn:hover {
        background: var(--brand-dark);
      }
      .elf-btn:active {
        transform: translateY(1px);
      }
      .elf-btn[disabled] {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .elf-status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.92rem;
        display: none;
      }
      .elf-status.show {
        display: block;
      }
      .elf-status.ok {
        background: #e7f6ec;
        color: #14532d;
        border: 1px solid #b6e2c5;
      }
      .elf-status.warn {
        background: #fdf3e0;
        color: #7a4f00;
        border: 1px solid #f3dca6;
      }
      .elf-status.err {
        background: #fdecec;
        color: #7f1d1d;
        border: 1px solid #f5c5c5;
      }
      @media (max-width: 480px) {
        .elf-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <form class="elf-wrap" id="elf-lead-form" novalidate>
      <h2>Solicitá información</h2>
      <p class="elf-sub">
        Completá el formulario y un asesor te contactará a la brevedad.
      </p>

      <!-- ===== Contact ===== -->
      <fieldset>
        <legend>Datos de contacto</legend>
        <div class="elf-grid">
          <div class="elf-field full">
            <label for="elf-name">Nombre <span class="req">*</span></label>
            <input
              id="elf-name"
              name="name"
              type="text"
              autocomplete="name"
              required
            />
          </div>
          <div class="elf-field">
            <label for="elf-email">Email <span class="req">*</span></label>
            <input
              id="elf-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="elf-field">
            <label for="elf-phone">Teléfono</label>
            <input
              id="elf-phone"
              name="phone"
              type="tel"
              autocomplete="tel"
              inputmode="tel"
            />
          </div>
          <div class="elf-field full">
            <label for="elf-message">Mensaje</label>
            <textarea
              id="elf-message"
              name="message"
              placeholder="Contanos en qué podemos ayudarte"
            ></textarea>
          </div>
        </div>
      </fieldset>

      <!-- ===== Property / real-estate (optional) ===== -->
      <fieldset>
        <legend>Sobre la propiedad (opcional)</legend>
        <div class="elf-grid">
          <div class="elf-field">
            <label for="elf-property-ref">Código de propiedad</label>
            <input
              id="elf-property-ref"
              name="property_ref"
              type="text"
              placeholder="Ej: CL-123"
            />
          </div>
          <div class="elf-field">
            <label for="elf-property-value">Valor (CLP)</label>
            <input
              id="elf-property-value"
              name="property_value_clp"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              placeholder="Ej: 95000000"
            />
          </div>
          <div class="elf-field">
            <label for="elf-category">Categoría</label>
            <select id="elf-category" name="lead_category">
              <option value="">Seleccionar…</option>
              <option value="compra">Compra</option>
              <option value="venta">Venta</option>
              <option value="arriendo">Arriendo</option>
              <option value="consulta">Consulta</option>
            </select>
          </div>
          <div class="elf-field">
            <label for="elf-type-interest">Tipo de interés</label>
            <select id="elf-type-interest" name="property_type_interest">
              <option value="">Seleccionar…</option>
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
              <option value="terreno">Terreno</option>
              <option value="oficina">Oficina</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="elf-field full">
            <label for="elf-reason">Motivo de compra</label>
            <input
              id="elf-reason"
              name="reason_purchase"
              type="text"
              placeholder="Ej: Primera vivienda, inversión"
            />
          </div>
          <div class="elf-field full">
            <label for="elf-credit">¿Tenés crédito aprobado?</label>
            <select id="elf-credit" name="has_credit">
              <option value="">Seleccionar…</option>
              <option value="si">Sí</option>
              <option value="no">No</option>
              <option value="en_tramite">En trámite</option>
            </select>
          </div>
        </div>
      </fieldset>

      <button type="submit" class="elf-btn" id="elf-submit">Enviar</button>

      <div
        class="elf-status"
        id="elf-status"
        role="status"
        aria-live="polite"
      ></div>
    </form>

    <script>
      "use strict";
      (function () {
        // ====================================================================
        // CONFIG — replace these two values before going live.
        // ====================================================================
        // Full URL of the Odoo endpoint = <web.base.url> + "/api/v1/leads".
        // Find web.base.url in Odoo: Settings ‣ Technical ‣ Parameters ‣ System
        // Parameters. Example: https://crm.ia-prop.com/api/v1/leads
        var ENDPOINT_URL = "https://crm.ia-prop.com/api/v1/leads";

        // ⚠️ SECURITY: this key is visible to anyone who opens DevTools.
        // For production use a proxy + rate limiting + reCAPTCHA. See header note.
        var API_KEY = "REPLACE-WITH-YOUR-API-KEY";

        // ====================================================================
        var form = document.querySelector("#elf-lead-form");
        var btn = document.querySelector("#elf-submit");
        var statusEl = document.querySelector("#elf-status");
        var ORIG_BTN_TEXT = btn.textContent;

        function setStatus(kind, message) {
          statusEl.textContent = message;
          statusEl.className = "elf-status show " + kind;
        }

        function clearStatus() {
          statusEl.className = "elf-status";
          statusEl.textContent = "";
        }

        // Build the JSON payload from the form. Empty optional values are dropped
        // so we never send null/empty strings to the API.
        function buildPayload() {
          var raw = new FormData(form);
          var payload = {};
          raw.forEach(function (value, key) {
            var v = (value || "").trim();
            if (v !== "") payload[key] = v;
          });
          return payload;
        }

        // Minimal client-side validation mirroring the server rule:
        // name + (email OR phone) are required when "require contact info" is on.
        function validate(payload) {
          var errors = [];
          if (!payload.name) errors.push("el nombre es obligatorio");
          if (!payload.email && !payload.phone) {
            errors.push("necesitás un email o un teléfono");
          }
          return errors;
        }

        function setLoading(loading) {
          btn.disabled = loading;
          btn.textContent = loading ? "Enviando…" : ORIG_BTN_TEXT;
        }

        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          clearStatus();

          var payload = buildPayload();
          var errors = validate(payload);
          if (errors.length) {
            setStatus(
              "err",
              "Revisá el formulario: " + errors.join(", ") + ".",
            );
            return;
          }

          setLoading(true);

          fetch(ENDPOINT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": API_KEY,
            },
            body: JSON.stringify(payload),
          })
            .then(function (res) {
              // Always parse JSON: both success and error bodies are JSON.
              return res.json().then(function (body) {
                return { ok: res.ok, status: res.status, body: body };
              });
            })
            .then(function (result) {
              var body = result.body || {};
              // Created (201) or duplicate (200) are both "received" from the
              // user's point of view; only duplicate gets a softer message.
              if (result.status === 201 || result.status === 200) {
                if (body.status === "duplicate") {
                  setStatus(
                    "ok",
                    "¡Gracias! Ya teníamos tu solicitud registrada, te contactaremos igual.",
                  );
                } else {
                  setStatus(
                    "ok",
                    "¡Gracias! Tu solicitud fue recibida correctamente.",
                  );
                }
                form.reset();
              } else {
                // Map known error codes to friendly Spanish messages.
                var code = body.error && body.error.code;
                var friendly;
                switch (code) {
                  case "invalid_api_key":
                    friendly =
                      "No se pudo validar la integración. Avisá al administrador.";
                    break;
                  case "validation":
                    friendly = "Faltan datos o algún valor no es válido.";
                    break;
                  case "create_failed":
                    friendly =
                      "No pudimos registrar tu solicitud. Probá de nuevo más tarde.";
                    break;
                  default:
                    friendly =
                      "Ocurrió un error. Probá de nuevo en unos minutos.";
                }
                setStatus("err", friendly);
              }
            })
            .catch(function () {
              // Network failure, CORS rejection, or non-JSON response.
              setStatus(
                "err",
                "Error de conexión. Revisá tu internet e intentá nuevamente.",
              );
            })
            .finally(function () {
              setLoading(false);
            });
        });
      })();
    </script>
  </body>
</html>
